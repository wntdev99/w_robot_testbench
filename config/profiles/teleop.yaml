# 조이스틱 텔레옵 묶음 (DESIGN.md §6.2)
# exclusive:true → 이 묶음 기동 시 비-persistent 프로파일은 종료.
profile:
  id: teleop
  label: "조이스틱 텔레옵"
  category: teleop
  exclusive: true
  processes:
    - id: teleop_joy
      machine: server
      kind: launch
      command: "ros2 launch w_robot_teleoperation teleop_joy.launch.py"
      healthcheck:
        type: topic
        topic: /joy
        timeout_s: 10
    - id: twist_mux
      machine: server
      kind: launch
      command: "ros2 launch w_robot_teleoperation twist_mux.launch.py"
      depends_on: [teleop_joy]
