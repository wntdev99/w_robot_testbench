# 테스트벤치 런타임 설정 (SSOT: DESIGN.md §6.1)
server:
  host: 0.0.0.0
  port: 8080

machines:
  server:                       # 웹툴이 도는 머신 (PC1)
    id: pc1
    host: 192.168.34.202
    role: server
  controller:                   # 모터/제어 머신 (PC2) — SSH 런치 전용
    id: pc2
    host: 192.168.34.201
    role: controller
    ssh_user: ubuntu
    ws: ~/colcon_ws
    # SSH 비대화형 셸에서 ROS 환경을 잡기 위한 prefix.
    # ⚠ 비대화형 SSH는 .bashrc 를 안 읽으므로, 201 이 .bashrc 로 받던 zenoh 환경
    #   (RMW=zenoh + 라우터 클라이언트 엔드포인트)을 여기서 명시해야 한다.
    #   누락 시 노드가 기본 RMW(FastDDS)로 떠서 크래시·미연결됨.
    setup: "export LC_ALL=C; export RMW_IMPLEMENTATION=rmw_zenoh_cpp; export ZENOH_CONFIG_OVERRIDE='mode=\"client\";connect/endpoints=[\"tcp/192.168.34.202:7447\"]'; source /opt/ros/jazzy/setup.bash; source ~/colcon_ws/install/setup.bash"

zenoh:
  router_cmd: "ros2 run rmw_zenoh_cpp rmw_zenohd"
  process_match: "rmw_zenohd"   # 로컬 프로세스 매칭(보조 판정)
  router_port: 7447             # 라우터 TCP 엔드포인트 포트(주 판정). 기본 7447
  # router_host 미지정 시 server.host(202) 사용 — 백엔드가 어느 머신에 있든 라우터 위치를 본다

liveness:
  controller_machine:
    method: ping                # 201 연결 여부 → "단독 vs 함께" 판정
    host: 192.168.34.201
    interval_s: 5

# 동적 토픽 구독 스트림 기본값
streaming:
  default_rate_hz: 20           # WS 다운샘플 상한
  diagnostics_topic: "/diagnostics"

# 카메라 MJPEG 스트림 (다중 카메라 대비) — 인코딩은 spin 밖 스레드풀에서 fps 맞춰 수행
camera:
  fps: 12                       # 스트림/인코딩 목표 프레임레이트(수신 프레임을 매번 인코딩하지 않음)
  max_width: 640                # 인코딩 전 가로 상한(px). 초과 시 비율 유지 다운스케일. 0=무제한
  jpeg_quality: 80              # JPEG 품질(1~100)
