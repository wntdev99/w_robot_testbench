[project]
name = "w-robot-testbench"
version = "0.3.0"
description = "웹 기반 ROS2 로봇 테스트벤치 — 테스트 프로젝트 패러다임 (DESIGN v0.3)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pyyaml",
    "psutil",
    "asyncssh",
]
# rclpy 는 시스템 ROS2 Jazzy(apt) 제공 — pip 미설치. source /opt/ros/jazzy/setup.bash 로 주입.

[project.scripts]
testbench = "testbench.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
